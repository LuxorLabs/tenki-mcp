name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runner selection: Tenki's own runners for everything except pull requests from
# FORKS, which stay on GitHub-hosted runners. A public repo plus self-hosted
# runners would otherwise let any fork PR execute code on our infrastructure.
jobs:
  # Cheap, fails fast, and catches the class of error that would otherwise only
  # surface AFTER npm publish has already succeeded during a release.
  manifests:
    name: Manifest consistency
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'tenki-standard-small-2c-4g' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate server.json / package.json for MCP Registry publish
        run: node scripts/validate-server-json.mjs

  build-and-parity:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'tenki-standard-small-2c-4g' }}
    strategy:
      fail-fast: false
      matrix:
        # 24 = Active LTS, 22 = Maintenance LTS. Node 20 went EOL 2026-04-30
        # and was dropped; keep this matrix in step with package.json engines.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
      - run: npm ci

      - name: Build
        run: npm run build

      # Invoke the package's own test script rather than re-listing suites here.
      # The previous inline list had already drifted: test/exec-output.test.mjs
      # was in `npm test` but absent from CI.
      - name: Offline test suite
        run: npm test

      - name: Parity audit (fails if any API method lacks a tool)
        run: node scripts/parity-audit.mjs

      # The live suites (test/journeys, coverage, errors-edge, admin-previews,
      # client-integration, http-transport, registry-shapes) need a TENKI_API_KEY
      # secret + reachable data plane; run them locally with `npm run test:all`.

  audit:
    name: Dependency audit
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'tenki-standard-small-2c-4g' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      # Its own job so a transient registry hiccup or a fresh advisory does not
      # mask the build/test result, and so it runs once instead of per matrix leg.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  # Proves the published tarball is exactly what is intended, on every PR --
  # before a tag makes it irreversible.
  package:
    name: Package contents
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'tenki-standard-small-2c-4g' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Pack and list contents
        run: |
          npm pack --dry-run 2>&1 | tee pack.log
          # dist/index.js is the bin entrypoint; if it is missing the package is
          # installable but unrunnable.
          grep -q 'dist/index.js' pack.log || { echo "::error::dist/index.js absent from tarball"; exit 1; }
