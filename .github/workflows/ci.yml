name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - name: Build
        run: npm run build
      - name: Parity audit (fails if any API method lacks a tool)
        run: node scripts/parity-audit.mjs
      - name: Offline test suite (no live token needed)
        run: node test/offline.test.mjs
      # The live suites (test/*.test.mjs against api.tenki.cloud) need a TENKI_API_KEY
      # secret + reachable data plane; run them locally with `npm run test:all`.
