version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # @modelcontextprotocol/sdk and zod are the only runtime deps; keep them
      # separate from tooling so a runtime bump gets a deliberate look.
      runtime:
        patterns: ["@modelcontextprotocol/sdk", "zod"]
      dev-tooling:
        patterns: ["typescript", "@types/*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
